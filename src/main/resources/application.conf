##
## VideoToImage -- Application Configuration
## HOCON format. All values are overridable via `-Dkey=value` JVM properties
## or an external `application.conf` placed on the runtime classpath.
##

app {
    name        = "VideoToImage"
    version     = "1.0.0"
    vendor      = "SurajS"
    vendorUrl   = "https://www.linkedin.com/in/shingade-v-s/"
}

extraction {
    ## Frame sampling defaults
    sampling {
        ## Strategy: INTERVAL_FRAMES | INTERVAL_SECONDS | SCENE_CHANGE
        strategy          = "INTERVAL_SECONDS"
        intervalFrames    = 30
        intervalSeconds   = 1.0

        ## SCENE_CHANGE tuning. Consecutive frames are reduced to a 32x32 luma
        ## grid; `threshold` is the normalised mean absolute difference at or
        ## above which a shot boundary is reported. Lower catches softer
        ## transitions but also camera motion; higher only catches hard cuts.
        sceneChange {
            threshold          = 0.12
            ## Shortest gap between two reported cuts. Debounces cross-fades
            ## and flashes, which otherwise report a burst of adjacent cuts.
            minIntervalSeconds = 0.5
        }
    }

    ## Output defaults
    output {
        directory         = ${user.home}"/VideoToImage/output"
        format            = "PNG"              # PNG | JPEG | WEBP
        jpegQuality       = 0.92
        resize {
            enabled       = false
            maxWidth      = 1920
            maxHeight     = 1080
        }
        writeMetadataSidecar = true
    }

    ## Uniqueness / deduplication
    uniqueness {
        ## Sensitivity preset: STRICT | BALANCED | PERMISSIVE
        preset               = "BALANCED"
        ## Sliding-window size for recent-hash comparison
        windowSize           = 32
        ## Hamming distance thresholds per preset (bits out of 64)
        thresholds {
            STRICT           = 3
            BALANCED         = 5
            PERMISSIVE       = 10
        }
        ## Secondary structural check for frames the hash was not confident
        ## about. A candidate whose nearest neighbour sits within
        ## (preset threshold, preset threshold + borderlineBand] bits is
        ## compared pixel-structurally; scoring `threshold` or above rejects it
        ## as a duplicate the hash would have let through.
        ssim {
            enabled          = true
            borderlineBand   = 5
            threshold        = 0.92
        }
    }

    ## Hard cap on frames persisted per job (0 = unlimited)
    maxFramesPerJob       = 0
}

concurrency {
    ## Maximum number of videos processed concurrently
    maxParallelJobs       = 2
    ## Worker pool size for per-job CPU-bound stages (0 = Runtime.availableProcessors())
    perJobPoolSize        = 0
}

ai {
    ## AI analyzers are discovered via ServiceLoader. Registered analyzers
    ## are listed here; individual analyzers check their own enabled flag.
    djl {
        ## Default-disabled on purpose: enabling this downloads model weights
        ## (a few hundred MB, once) the first time a frame is analysed.
        enabled           = false
        ## resnet      -- image classification, writes tags
        ## ssd         -- object detection, writes labelled bounding boxes
        ## placeholder -- loads nothing, returns empty metadata
        modelProvider     = "resnet"
        ## Predictions weaker than this are discarded.
        minConfidence     = 0.25
        ## Most labels / objects recorded per frame.
        maxResults        = 5
    }
}

ui {
    theme                 = "FLATLAF_INTELLIJ_DARK"   # FLATLAF_LIGHT | FLATLAF_DARK | FLATLAF_INTELLIJ_DARK | FLATLAF_INTELLIJ_LIGHT
    locale                = "en"
    thumbnail {
        width             = 192
        height            = 108
    }
    logConsole {
        maxLines          = 5000
    }
}

logging {
    level                 = "INFO"
}
