# Maven Wrapper. Run ./mvnw (or mvnw.cmd on Windows) instead of mvn, and the
# pinned Maven version below is downloaded on first use. No Maven install needed.
#
# distributionType=only-script keeps a binary out of the repository: the wrapper
# scripts fetch the distribution themselves, so there is no maven-wrapper.jar to
# commit or to review.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
