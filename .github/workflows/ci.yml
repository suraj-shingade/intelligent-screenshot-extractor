name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        java: [ '22' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # bash is present on every runner, including Windows, so the same
      # wrapper script runs on all three platforms.
      - name: Build and run tests
        run: ./mvnw -B clean verify
        shell: bash

      - name: Build fat JAR
        run: ./mvnw -B -Pfatjar package -DskipTests
        shell: bash
